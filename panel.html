<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSNND0</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div id="root">

<div id="header">
  <div class="right">
    <span id="badge" title="Open settings">model</span>
  </div>
</div>

<div id="anonWarn" class="anon-warn">Warning: Anonymous agent can access all personal data</div>

<div id="presetBar"></div>

<div id="pool">
  <div class="bubble hint">Type a message, or press <kbd>/</kbd> for commands.<br>Toggle <b style="color:var(--accent-hi)">Agent mode</b> below to drive the current tab.</div>
</div>

<div id="foot">
  <div id="cmdOverlay">
    <div class="ov-hdr">
      <span class="ov-icon">/</span>
      <span class="ov-hint">Tab autocomplete &middot; Enter run</span>
      <span class="ov-cnt" id="ovCnt">0</span>
    </div>
    <div class="ov-body" id="ovBody"></div>
    <div class="ov-detail" id="ovDetail"></div>
  </div>
  <div id="inputWrap">
    <div id="inpShell">
      <textarea id="inp" rows="1" placeholder="Message\u2026" enterkeyhint="send"></textarea>
      <div id="inpActions">
        <div class="left-actions">
          <div class="action-pill" id="anonToggle">
            <span class="action-dot"></span>
            <span class="anon-text">Ask</span>
          </div>
          <div class="action-pill" id="agentPill" data-mode="chat">
            <span class="action-dot"></span>
            <span>Agent mode</span>
          </div>
        </div>
        <button id="go" disabled>
          <svg viewBox="0 0 24 24">
            <path d="M12 19V5M12 5L5 12M12 5L19 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="disclaimer">AgentSSNND0 will make mistakes</div>
  </div>
</div>

</div>

<script type="module" src="js/panel.js"></script>
</body>
</html>
