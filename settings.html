<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JEV Settings</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <div>
          <p class="eyebrow">Configuration</p>
          <h1>JEV + AI Agent</h1>
        </div>
      </header>

      <section class="settings-group">
        <label for="provider">AI provider</label>
        <select id="provider">
          <option value="openrouter">OpenRouter</option>
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
        </select>
      </section>

      <section class="settings-group">
        <label for="api-key">API key</label>
        <input id="api-key" type="password" placeholder="sk-..." />
      </section>

      <section class="settings-group">
        <label for="model">Model</label>
        <input id="model" type="text" value="openai/gpt-4o-mini" />
      </section>

      <section class="settings-group">
        <button id="save-settings" class="primary-button">Save</button>
      </section>

      <p id="status" class="status-text">Settings are stored locally.</p>
    </main>

    <script type="module" src="/src/settings-app.ts"></script>
  </body>
</html>
