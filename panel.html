<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentSSNND0</title>
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-kicker">AI agent</span>
          <h1>AgentSSNND0</h1>
        </div>
        <button id="open-settings" class="ghost-button" type="button">Model</button>
      </header>

      <div class="mode-row" aria-label="Interaction modes">
        <button class="mode-button active" data-mode="chat" type="button">Chat</button>
        <button class="mode-button" data-mode="agent" type="button">Agent</button>
        <button class="mode-button" data-mode="inspect" type="button">Inspect</button>
        <button class="mode-button" data-mode="cursor-follow" type="button">Cursor follow</button>
      </div>

      <main class="workspace">
        <section class="panel-card task-card">
          <div class="section-header">
            <span class="status-dot"></span>
            <span>Task</span>
          </div>

          <textarea id="task-input" rows="4" placeholder="Describe the next action to take on this page…">Review the current page and choose the right next action.</textarea>

          <div class="cta-row">
            <button id="read-page" class="secondary-button" type="button">Read page</button>
            <button id="run-task" class="primary-button" type="button">Run agent</button>
          </div>
        </section>

        <section class="panel-card insight-card">
          <div class="section-header">
            <span class="status-dot accent-dot"></span>
            <span>Page insight</span>
          </div>
          <p id="page-summary" class="page-summary">Waiting for page context…</p>
          <div id="insight-tags" class="tag-row"></div>
        </section>

        <section class="panel-card decisions-card">
          <div class="section-header">
            <span class="status-dot success-dot"></span>
            <span>Recommended actions</span>
          </div>
          <ul id="decision-list" class="decision-list"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="./src/sidepanel.ts"></script>
  </body>
</html>
